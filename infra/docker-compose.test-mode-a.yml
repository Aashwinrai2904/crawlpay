# Mode A live-verification stack: the CrawlPay middleware running as a real
# reverse proxy in front of a real WordPress + MySQL, with a mock x402
# facilitator so payment proofs verify without touching Coinbase infra.
#
# Driven by infra/mode-a/test-mode-a.sh. Not for production.
#
#   middleware (:8787, published)  --reverse proxy-->  wordpress (:80, also
#   published on :8780 for the test script's readiness/debug checks)
#
name: crawlpay-mode-a-test

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwordpress", "-pwordpress"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    # NOTE: the current middleware never actually connects to Redis --
    # buildServer() always uses an in-memory CacheStore and nothing reads
    # CRAWLPAY_REDIS_URL. Kept here per the Mode A spec so the stack is
    # ready the day that changes.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Public address of the site is the middleware, not this container.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_HOME', 'http://localhost:8787' );
        define( 'WP_SITEURL', 'http://localhost:8787' );
    volumes:
      - wp-data:/var/www/html
      - ./mode-a/mu-plugin.php:/var/www/html/wp-content/mu-plugins/crawlpay-mode-a.php:ro
      - ./mode-a/apache-allow-override.conf:/etc/apache2/conf-enabled/zz-crawlpay-allow-override.conf:ro
    ports:
      # Not used by the middleware (it proxies to http://wordpress over the
      # Docker network); exposed only so test-mode-a.sh can poll WordPress
      # directly for readiness and diff proxied vs. direct responses.
      - "8780:80"

  mock-facilitator:
    build:
      context: ..
      dockerfile: infra/mock-facilitator/Dockerfile
    environment:
      PORT: "8889"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8889/price-quote"]
      interval: 5s
      timeout: 3s
      retries: 20

  middleware:
    build:
      context: ..
      dockerfile: infra/mode-a/middleware.Dockerfile
    depends_on:
      wordpress:
        condition: service_started
      mock-facilitator:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8787"
      # The middleware reads ORIGIN_URL (src/server.ts); CRAWLPAY_ORIGIN_URL
      # from the task spec is currently NOT read by the code, so both are set.
      ORIGIN_URL: http://wordpress
      CRAWLPAY_ORIGIN_URL: http://wordpress
      CRAWLPAY_SITE_KEY: test-key-xyz
      CRAWLPAY_FACILITATOR_URL: http://mock-facilitator:8889
      CRAWLPAY_SITE_ID: test-site
      CRAWLPAY_REDIS_URL: redis://redis:6379
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-off WP-CLI runner sharing the WordPress volume. profiles: keeps it
  # out of `docker compose up`; the test script invokes it with
  # `docker compose run --rm wpcli wp ...`.
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp-data:/var/www/html
      - ./mode-a/mu-plugin.php:/var/www/html/wp-content/mu-plugins/crawlpay-mode-a.php:ro

volumes:
  wp-data:
