services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawlpay
      POSTGRES_PASSWORD: crawlpay
      POSTGRES_DB: crawlpay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mock-origin:
    build:
      context: ..
      dockerfile: infra/mock-origin/Dockerfile
    ports:
      - "4000:4000"

  mock-facilitator:
    build:
      context: ..
      dockerfile: infra/mock-facilitator/Dockerfile
    ports:
      - "4100:4100"

volumes:
  redis-data:
  postgres-data:
